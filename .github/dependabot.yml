# 워크플로우 액션은 SHA로 고정한다(태그 이동·탈취 방어). Dependabot이
# 새 버전의 SHA와 버전 주석을 함께 갱신하는 PR을 연다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # major 를 포함한 모든 액션 업데이트를 PR 하나로 묶는다(작업 단위마다 PR 을 쪼개지 않는다).
      # major 는 머지 전에 릴리스 노트의 호환성 변경을 반드시 확인한다 — PR 검사는 배포
      # 흐름(release.yml, main 머지 후 실행)을 검증하지 못한다.
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    ignore:
      # changesets/action v2 는 Changesets CLI v3 를 요구하고(v2 CLI 는 거부) 입력·출력 이름이
      # 바뀌었다(publish→publish-script, pullRequestNumber→pr-number, 토큰은 github-token 입력).
      # CLI v3 마이그레이션과 release.yml 수정을 함께 할 때까지 v1 에 머문다.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
