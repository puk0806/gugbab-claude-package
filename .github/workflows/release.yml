name: release

# 두 가지 흐름:
# 1. push: main → changesets/action → Version PR 자동 생성 또는 publish
# 2. workflow_dispatch (mode=initial) → 첫 v1.0.0 publish (changeset 우회)
#
# 첫 v1.0.0 publish 직전에 npm.com Org + NPM_TOKEN secret 등록이 선행되어야 한다.
# 자세한 설계는 docs/superpowers/specs/2026-05-08-npm-v1-publishing-design.md 참조.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: '발행 모드'
        required: true
        type: choice
        default: changeset
        options:
          - changeset    # 표준: changesets/action — Version PR 또는 publish
          - initial      # 첫 v1.0.0: changeset 없이 직접 publish

permissions:
  contents: write       # changesets/action 의 Version PR / 태그 생성용
  pull-requests: write  # Version PR 생성용
  id-token: write       # provenance (sigstore) 인증
  actions: write        # 머지 후 workflow_dispatch 재트리거용 (gh workflow run)
  statuses: write       # Version PR 검증 후 ci·visual-regression 상태 등록용

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.9.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.1
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      # ─────────────────────────────────────────────────────────────
      # 표준 흐름 — push:main 또는 workflow_dispatch(mode=changeset)
      # changesets/action 이 새 changeset 감지 시 Version PR 생성,
      # changeset 0개면 publish 단계 직접 실행.
      # ─────────────────────────────────────────────────────────────
      - name: Create Release Pull Request or Publish
        id: changesets
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.mode == 'changeset')
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm changeset publish
          version: pnpm changeset version
          commit: '[scripts] Modify: version packages [skip ci]'
          title: '[scripts] Modify: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # actions/setup-node 가 만든 .npmrc 의 ${NODE_AUTH_TOKEN} placeholder 치환용.
          # NPM_TOKEN 만 있으면 NPM_CONFIG_USERCONFIG 의 placeholder 가 빈 값이 되어 PUT 404 발생.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action 이 Version PR 을 새로 만들었거나 업데이트한 경우 머지까지 자동화한다.
      # 사용자는 feature PR 한 번만 머지하면 npm publish 까지 자동 진행된다.
      # (publish 모드로 실행된 경우 pullRequestNumber 가 비어 있어 이 step 은 skip.)
      #
      # main 규칙은 `ci`·`visual-regression` 필수 검사 + PR 필수 + 우회 없음이다.
      # GITHUB_TOKEN 이 만든 Version PR 에는 두 검사 워크플로우가 돌지 않으므로
      # scripts/ci-verify-bot-pr.sh 가 ① 버전·CHANGELOG·changeset 파일만 바뀌었는지 확인하고
      # ② 같은 전체 검사를 직접 수행한 뒤 ③ 통과 시에만 두 상태를 등록한다.
      # 검증에 실패하면 상태가 없어 Version PR 은 막힌 채 남는다(사람이 확인).
      #
      # 머지 후: GITHUB_TOKEN 의 push 는 on:push 를 재트리거하지 않으므로
      # (GitHub 재귀 방지 정책 — workflow_dispatch 는 예외) publish 를 명시 재트리거한다.
      # changeset publish 는 npm 에 이미 있는 버전을 건너뛰므로 중복 실행에 안전하다.
      - name: Verify Version PR and register required checks
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          # 스크립트가 PR 커밋을 체크아웃하므로 실행 중 파일이 바뀌지 않게 복사본으로 실행한다
          cp scripts/ci-verify-bot-pr.sh "$RUNNER_TEMP/"
          bash "$RUNNER_TEMP/ci-verify-bot-pr.sh" "$PR_NUMBER" \
            '^(\.changeset/.*|(.*/)?CHANGELOG\.md|(.*/)?package\.json)$'

      - name: Merge Version PR and trigger publish
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          gh pr merge --merge --repo "$GITHUB_REPOSITORY" "$PR_NUMBER"
          gh workflow run release --repo "$GITHUB_REPOSITORY" --ref main -f mode=changeset

      # ─────────────────────────────────────────────────────────────
      # 첫 v1.0.0 publish — workflow_dispatch(mode=initial)
      # 9 packages/*/package.json 의 version 이 이미 "1.0.0" 으로 셋업되어
      # 있는 상태에서 changeset 우회로 직접 publish.
      # ─────────────────────────────────────────────────────────────
      - name: Initial v1.0.0 publish (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'initial'
        env:
          # actions/setup-node 가 NPM_CONFIG_USERCONFIG 로 가리키는 .npmrc 에
          # `_authToken=${NODE_AUTH_TOKEN}` 형태로 적어두므로, 이 env 가 없으면
          # placeholder 가 빈 값으로 치환되어 PUT 요청이 익명 호출이 된다.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          # 의존 토폴로지 자동 정렬 publish. 인증은 setup-node 의 .npmrc 로 처리.
          pnpm -r publish --provenance --no-git-checks --access public
